name: Core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      SILVERFILE_ENABLE_NATIVE_OCR: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python --version
      # Integration tests run without OCR; tests marked needs_ocr skip themselves (native OCR is disabled).
      - run: python -m pytest tests --ignore=tests/live --ignore=tests/native_ocr -q -rs
